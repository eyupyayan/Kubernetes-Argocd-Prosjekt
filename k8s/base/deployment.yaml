apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-argocd-lab
  namespace: batman-lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: k8s-argocd-lab
  template:
    metadata:
      labels:
        app: k8s-argocd-lab
    spec:
      containers:
        - name: app
          image: eyupyayan/k8s-argocd-lab:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
